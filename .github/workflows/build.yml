name: Build OrangeFox for XiaoYuan S2 (trinket)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 python-is-python3 aria2 patch cpio
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
      - name: 同步源码（OrangeFox fox_11.0 官方 sync 链）
        run: |
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git config --global url."https://gitlab.com/".insteadOf "ssh://git@gitlab.com:"
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          export GIT_TERMINAL_PROMPT=0
          export PATH="$PATH:$HOME/bin"
          echo "PATH=$PATH"
          which repo && repo --version || echo "REPO_MISSING_IN_PATH"
          git clone https://github.com/momo54181/sync.git
          cd sync
          chmod 777 orangefox_sync.sh
          ./orangefox_sync.sh --branch 11.0 --path $GITHUB_WORKSPACE/fox_11.0
      - name: 修复 vendor/twrp（统一用 TeamWin android-11）
        run: |
          echo "=== 旧 vendor/twrp ==="; ls $GITHUB_WORKSPACE/fox_11.0/vendor/twrp 2>&1 | head
          rm -rf $GITHUB_WORKSPACE/fox_11.0/vendor/twrp
          git clone --depth 1 -b android-11 https://github.com/TeamWin/android_vendor_twrp.git $GITHUB_WORKSPACE/fox_11.0/vendor/twrp
          test -f $GITHUB_WORKSPACE/fox_11.0/vendor/twrp/build/envsetup.sh && echo VENDOR_TWRP_OK || { echo VENDOR_TWRP_MISSING; exit 1; }
      - name: 放入 device tree
        run: |
          mkdir -p $GITHUB_WORKSPACE/fox_11.0/device/onyx/BOOX
          cp -r Android.bp Android.mk AndroidProducts.mk BoardConfig.mk README.md device.mk extract-files.sh omni_BOOX.mk twrp_BOOX.mk vendorsetup.sh recovery.fstab setup-makefiles.sh prebuilt $GITHUB_WORKSPACE/fox_11.0/device/onyx/BOOX/
      - name: 编译 OrangeFox（禁用 MTP + 去前光版）
        run: |
          cd $GITHUB_WORKSPACE/fox_11.0
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=BOOX
          export FOX_AB_DEVICE=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_VANILLA_BUILD=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          export OF_DISABLE_UPDATEZIP=1
          set +e
          . build/envsetup.sh
          echo "ENVSETUP_EXIT=$?"
          lunch twrp_BOOX-eng
          echo "LUNCH_EXIT=$?"
          set -e
          mka recoveryimage -j$(nproc)
      - name: 注入清 misc 脚本到 ramdisk（防止 abl 反复尝试 recovery 导致 QMMI）
        run: |
          cd $GITHUB_WORKSPACE/fox_11.0
          RECOVERY_IMG=out/target/product/BOOX/recovery.img
          HOST_BIN=out/host/linux-x86/bin

          WORKDIR=$(mktemp -d)
          cd $WORKDIR

          # 用 AOSP 自带 unpackbootimg 解包
          $GITHUB_WORKSPACE/fox_11.0/$HOST_BIN/unpackbootimg -i $GITHUB_WORKSPACE/fox_11.0/$RECOVERY_IMG -o .
          ls -la

          # 找 ramdisk 文件
          RAMDISK_FILE=""
          for f in ramdisk.cpio.gz recovery.img-ramdisk.gz recovery.img-ramdisk; do
            if [ -f "$f" ]; then RAMDISK_FILE="$f"; break; fi
          done
          echo "RAMDISK_FILE=$RAMDISK_FILE"

          # 解包 ramdisk
          mkdir ramdisk_ext
          cd ramdisk_ext
          case "$RAMDISK_FILE" in
            *.gz)
              gunzip -c ../$RAMDISK_FILE | cpio -idm
              ;;
            *)
              cpio -idm < ../$RAMDISK_FILE
              ;;
          esac

          # 写入清 misc init 脚本（on fs 阶段 bootdevice 符号链接已创建）
          printf '%s\n' \
            'on fs' \
            '    exec_start clear_misc' \
            '' \
            'service clear_misc /system/bin/dd if=/dev/zero of=/dev/block/bootdevice/by-name/misc bs=1024 count=1' \
            '    user root' \
            '    group root' \
            '    oneshot' \
            '    disabled' > init.recovery.clear-misc.rc
          echo "=== clear-misc rc ==="
          cat init.recovery.clear-misc.rc

          # 重新打包 ramdisk（gzip 压缩 cpio）
          find . | cpio -o -H newc 2>/dev/null | gzip -9 > ../ramdisk_new.cpio.gz
          cd ..

          # 读原参数
          PAGESIZE=$(cat recovery.img-pagesize)
          BASE=$(cat recovery.img-base)
          HDR_VER=$(cat recovery.img-header_version)
          CMDLINE=$(cat recovery.img-cmdline)

          echo "PAGESIZE=$PAGESIZE BASE=$BASE HDR_VER=$HDR_VER"
          echo "CMDLINE=$CMDLINE"

          # 重新打包 recovery.img
          $GITHUB_WORKSPACE/fox_11.0/$HOST_BIN/mkbootimg \
              --kernel kernel \
              --ramdisk ramdisk_new.cpio.gz \
              --cmdline "$CMDLINE" \
              --base $BASE \
              --pagesize $PAGESIZE \
              --header_version $HDR_VER \
              -o $GITHUB_WORKSPACE/fox_11.0/$RECOVERY_IMG

          echo "=== 清 misc 脚本注入完成 ==="
          ls -la $GITHUB_WORKSPACE/fox_11.0/$RECOVERY_IMG
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-s2
          path: |
            fox_11.0/out/target/product/BOOX/OrangeFox-*.img
            fox_11.0/out/target/product/BOOX/recovery.img
