name: Build OrangeFox for XiaoYuan S2 (trinket)
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-8-jdk
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
      - name: 同步 OrangeFox 源码（fox_11.0，Android 11）
        run: |
          # runner 无 SSH key，把 manifest 里的 SSH 地址重写为 HTTPS
          git config --global url."https://gitlab.com/".insteadOf "git@gitlab.com:"
          git config --global url."https://gitlab.com/".insteadOf "ssh://git@gitlab.com:"
          mkdir -p fox
          cd fox
          ~/bin/repo init -u https://gitlab.com/OrangeFox/Manifest.git -b fox_11.0 --depth=1
          ~/bin/repo sync -j$(nproc)
      - name: 放入 device tree
        run: |
          mkdir -p fox/device/onyx/BOOX
          cp -r Android.bp Android.mk AndroidProducts.mk BoardConfig.mk README.md device.mk extract-files.sh omni_BOOX.mk twrp_BOOX.mk vendorsetup.sh recovery.fstab setup-makefiles.sh prebuilt fox/device/onyx/BOOX/
      - name: 应用屏幕方向补丁（左旋90°+镜像）
        run: |
          cd fox
          python3 ../apply_rotate.py bootable/recovery/minuitwrp/graphics_fbdev.cpp || echo "rotate patch skipped (OrangeFox minuitwrp path may differ)"
      - name: 编译 OrangeFox
        run: |
          cd fox
          export ALLOW_MISSING_DEPENDENCIES=true
          export FOX_BUILD_DEVICE=BOOX
          export FOX_AB_DEVICE=1
          export OF_FORCE_PREBUILT_KERNEL=1
          export FOX_VANILLA_BUILD=1
          export OF_DEFAULT_KEYMASTER_VERSION=4.1
          . build/envsetup.sh
          lunch twrp_BOOX-eng
          mka recoveryimage -j$(nproc)
      - name: 注入 recovery_dtbo（原版 recovery 的 qcom 设备树表，含 trinket 平台）
        run: |
          cd fox
          python3 ../inject_recovery_dtbo.py out/target/product/BOOX/OrangeFox-unofficial-BOOX.img device/onyx/BOOX/prebuilt/recovery_dtbo.img
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: orangefox-s2
          path: fox/out/target/product/BOOX/OrangeFox-unofficial-BOOX.img
