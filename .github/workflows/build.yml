name: Build TWRP for XiaoYuan S2 (msm8953)
on: workflow_dispatch


jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4


      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git gnupg gperf imagemagick liblz4-tool libncurses5-dev libsdl1.2-dev libssl-dev libxml2 libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev python3 openjdk-8-jdk
          mkdir -p ~/bin
          curl https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
      - name: 同步 TWRP 源码（AOSP twrp-11 + 补 vendor/omni）
        run: |
          # runner 无 SSH key，把 manifest 里的 SSH 地址重写为 HTTPS
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git config --global url."https://github.com/".insteadOf "ssh://git@github.com/"
          mkdir -p twrp
          cd twrp
          # OmniROM android-11 分支部分项目已失效（frameworks/base 等被删），
          # 而 TWRP recovery 不需要完整 ROM 组件，故用 AOSP 的 TWRP minimal manifest
          ~/bin/repo init -u https://github.com/minimal-manifest-twrp/platform_manifest_twrp_aosp.git -b twrp-11 --depth=1
          ~/bin/repo sync -j$(nproc)
          # omni_BOOX.mk 继承 vendor/omni/config/common.mk，手动拉 OmniROM 的 vendor/omni（android-11）
          git clone -b android-11 --depth=1 https://github.com/omnirom/android_vendor_omni.git vendor/omni
          # OmniROM 的 soong generator(omnirom/soong/generator) 与 TWRP 的(twrp/song/generator 冲突，
          # recovery 不需要 OmniROM 的 soong 插件，删除 vendor/omni/build 禁用之
          rm -rf vendor/omni/build
      - name: 放入 device tree
        run: |
          mkdir -p twrp/device/onyx/BOOX
          cp -r Android.bp Android.mk AndroidProducts.mk BoardConfig.mk README.md device.mk extract-files.sh omni_BOOX.mk recovery.fstab setup-makefiles.sh vendorsetup.sh prebuilt twrp/device/onyx/BOOX/
      - name: 编译 recovery
        run: |
          cd twrp
          export ALLOW_MISSING_DEPENDENCIES=true
          . build/envsetup.sh
          lunch omni_BOOX-eng
          mka recoveryimage -j$(nproc)
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: twrp-s2
          path: twrp/out/target/product/BOOX/recovery.img
